<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BedWars</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="landing">
    <section id="card">
      <h1>BedWars</h1>
      <div id="form">
        <label>Username<input id="username" maxlength="16" autocomplete="off"><span id="usererror" class="error"></span></label>
        <label>Skin<select id="skin"></select><span id="skinerror" class="error"></span></label>
        <label>Invite code<input id="invite" maxlength="20" autocomplete="off"><span id="inviteerror" class="error"></span></label>
        <div id="actions">
          <button id="create" type="button">Create</button>
          <button id="join" type="button">Join</button>
        </div>
        <p id="actionerror" class="error" role="alert"></p>
      </div>
    </section>
  </main>

  <main id="lobby" hidden>
    <section id="lobbycard">
      <header id="lobbyhead">
        <div><span>Room</span><strong id="roomcode"></strong></div>
        <p id="hostnote"></p>
      </header>
      <div id="players"></div>
      <p id="lobbyerror" class="error" role="alert"></p>
      <div id="lobbyactions">
        <button id="random" type="button">Randomize</button>
        <button id="start" type="button">Start</button>
      </div>
    </section>
  </main>

  <main id="match" hidden>
    <section id="matchcard">
      <h1>BedWars</h1>
      <p>Room <strong id="matchcode"></strong> passed Milestone 1 lobby validation.</p>
      <p id="network">Establishing host connection…</p>
      <p class="muted">Milestone 2 gameplay is intentionally not started in this build.</p>
    </section>
  </main>

  <div id="stage" hidden></div>
  <div id="hud" hidden>
    <div id="cross"></div>
    <div id="hint">Click to capture mouse · WASD move · Space jump · Ctrl sprint · Shift crouch</div>
  </div>
  <script type="module" src="./mode/game.js"></script>
</body>
</html>
